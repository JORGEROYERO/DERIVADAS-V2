    .resumen-grid { grid-template-columns: 1fr; }
    .mapa-item { flex-wrap: wrap; }

// ===================== UTILIDADES =====================
function barajar(arr) {
  const copia = arr.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = copia[i]; copia[i] = copia[j]; copia[j] = tmp;
  }
  return copia;
}

function ordenOpciones(n) {
  return barajar(Array.from({ length: n }, (_, i) => i));
}

function minutos(ms) {
  return Math.round((ms / 60000) * 10) / 10;
}

function fechaTexto(ms) {
  return ms ? new Date(ms).toLocaleString("es-CO") : "";
}

function idUnico() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// Si el estudiante deja la pantalla quieta más de 5 minutos, ese rato no se suma al tiempo activo.
const PAUSA_MAXIMA = 5 * 60 * 1000;

// Identificador simple del equipo (fingerprint), igual al de los otros simuladores.
function generarFingerprint() {
  try {
    const cacheado = localStorage.getItem("epr_fp");
    if (cacheado) return cacheado;
  } catch (e) {}

  let canvasFp = "";
  try {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    ctx.textBaseline = "top";
    ctx.font = "14px Arial";
    ctx.fillStyle = "#f60";
    ctx.fillRect(0, 0, 60, 20);
    ctx.fillStyle = "#069";
    ctx.fillText("EPR-fp", 2, 2);
    canvasFp = canvas.toDataURL();
  } catch (e) {}

  let zonaHoraria = "";
  try {
    zonaHoraria = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
  } catch (e) {}

  const partes = [navigator.userAgent || "", navigator.language || "", navigator.hardwareConcurrency || "", navigator.deviceMemory || "", (screen.width || "") + "x" + (screen.height || "") + "x" + (screen.colorDepth || ""), zonaHoraria, canvasFp].join("###");

  let hash = 5381;
  for (let i = 0; i < partes.length; i++) {
    hash = (hash << 5) + hash + partes.charCodeAt(i);
    hash = hash & hash;
  }
  const fp = "EQ-" + Math.abs(hash).toString(36);

  try {
    localStorage.setItem("epr_fp", fp);
  } catch (e) {}
  return fp;
}

// Llama al Apps Script y recibe su respuesta (técnica JSONP con una etiqueta script).
let contadorLlamadas = 0;
function llamarScript(parametros, msLimite) {
  const limite = msLimite || 20000;
  return new Promise((resolve, reject) => {
    const nombreCb = "dpcResp" + Date.now() + "_" + (contadorLlamadas++);
    const script = document.createElement("script");
    let terminado = false;
    let reloj = null;
    const limpiar = () => {
      terminado = true;
      clearTimeout(reloj);
      window[nombreCb] = function () {};
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    window[nombreCb] = (datos) => {
      if (terminado) return;
      limpiar();
      resolve(datos);
    };
    reloj = setTimeout(() => {
      if (terminado) return;
      limpiar();
      reject(new Error("Sin respuesta del registro"));
    }, limite);
    script.onerror = () => {
      if (terminado) return;
      limpiar();
      reject(new Error("Error de red"));
    };
    const partes = Object.keys(parametros).map(k => k + "=" + encodeURIComponent(parametros[k]));
    partes.push("callback=" + nombreCb);
    script.src = SCRIPT_URL + "?" + partes.join("&");
    document.body.appendChild(script);
  });
}

// ===================== ESTADO DEL ESTUDIANTE =====================
const NOMBRE_COLUMNA = { basicas: "Repaso", producto: "Producto", cociente: "Cociente" };

function totalPasosDe(leccion) {
  return leccion.ejercicios.reduce((s, ej) => s + ej.pasos.length, 0);
}

function unidadesDe(leccion) {
  return leccion.teoria.length + totalPasosDe(leccion);
}

function parteLeccionNueva() {
  return {
    estado: "pendiente", inicio: null, fin: null, activoMs: 0, ultimoToque: null,
    fase: "teoria", iTeoria: 0, teoriaVista: 0,
    iEj: 0, iPaso: 0, pasosHechos: 0, descartadas: [], resuelto: false,
    aciertos: 0, errores: 0
  };
}

function evaluacionNueva() {
  return {
    estado: "pendiente", intento: 0, inicio: null, fin: null, activoMs: 0, ultimoToque: null,
    orden: [], opciones: {}, elecciones: {}, indice: 0, intentos: []
  };
}

function estadoNuevo() {
  const partes = {};
  LECCIONES.forEach(l => { partes[l.id] = parteLeccionNueva(); });
  return { version: 2, actualizado: 0, partes, evaluacion: evaluacionNueva(), pendientes: [] };
}

function normalizarEstado(e) {
  const base = estadoNuevo();
  if (!e || e.version !== 2) return base;
  LECCIONES.forEach(l => {
    base.partes[l.id] = { ...base.partes[l.id], ...((e.partes && e.partes[l.id]) || {}) };
  });
  base.evaluacion = { ...base.evaluacion, ...(e.evaluacion || {}) };
  base.pendientes = Array.isArray(e.pendientes) ? e.pendientes : [];
  base.actualizado = e.actualizado || 0;
  return base;
}

// Suma el tiempo transcurrido desde la última acción (con tope) al tiempo activo.
function tocar(parte, ahora) {
  const delta = parte.ultimoToque ? Math.min(Math.max(ahora - parte.ultimoToque, 0), PAUSA_MAXIMA) : 0;
  return { ...parte, activoMs: (parte.activoMs || 0) + delta, ultimoToque: ahora };
}

function avanceLeccion(leccion, parte) {
  if (parte.estado === "completada") return 100;
  return Math.floor(((parte.teoriaVista + parte.pasosHechos) / unidadesDe(leccion)) * 100);
}

function avanceEvaluacion(ev) {
  if (ev.estado === "completada") return 100;
  if (ev.estado !== "en curso") return 0;
  return Math.floor((Object.keys(ev.elecciones).length / EVALUACION.length) * 100);
}

function leccionesCompletas(estado) {
  return LECCIONES.every(l => estado.partes[l.id].estado === "completada");
}

function calcularResultado(ev) {
  let correctas = 0;
  EVALUACION.forEach(q => { if (ev.elecciones[q.id] === q.correcta) correctas++; });
  const total = EVALUACION.length;
  return {
    correctas,
    incorrectas: total - correctas,
    porcentaje: Math.round((correctas / total) * 100),
    nota: Math.round((correctas / total) * 5 * 10) / 10
  };
}

function textoEstadoActual(estado) {
  for (const l of LECCIONES) {
    const p = estado.partes[l.id];
    if (p.estado === "completada") continue;
    if (p.estado === "pendiente") return "Lección " + l.numero + " sin empezar";
    if (p.fase === "teoria") return "Lección " + l.numero + ": explicación " + (p.iTeoria + 1) + " de " + l.teoria.length;
    const actual = p.resuelto ? p.pasosHechos : p.pasosHechos + 1;
    return "Lección " + l.numero + ": paso " + actual + " de " + totalPasosDe(l);
  }
  const ev = estado.evaluacion;
  if (ev.estado === "en curso") return "Evaluación intento " + ev.intento + ": pregunta " + (ev.indice + 1) + " de " + EVALUACION.length;
  if (ev.estado === "completada") return "Terminado";
  return "Lecciones completas, falta la evaluación";
}

// Valores para la hoja de progreso (una fila por estudiante). Las llaves son los encabezados de la hoja.
function resumenDe(estado) {
  const r = {};
  let suma = 0;
  LECCIONES.forEach(l => {
    const p = estado.partes[l.id];
    const c = NOMBRE_COLUMNA[l.id];
    const avance = avanceLeccion(l, p);
    suma += avance;
    r[c + " %"] = avance;
    r[c + " inicio"] = fechaTexto(p.inicio);
    r[c + " fin"] = fechaTexto(p.fin);
    r[c + " duración (min)"] = (p.inicio && p.fin) ? minutos(p.fin - p.inicio) : "";
    r[c + " tiempo activo (min)"] = p.inicio ? minutos(p.activoMs || 0) : "";
    r[c + " precisión %"] = p.estado === "completada" ? Math.round((p.aciertos / totalPasosDe(l)) * 100) : "";
  });
  const ev = estado.evaluacion;
  const intentos = ev.intentos || [];
  const ultimo = intentos.length ? intentos[intentos.length - 1] : null;
  const avanceEv = avanceEvaluacion(ev);
  suma += intentos.length ? 100 : avanceEv;
  r["Evaluación %"] = avanceEv;
  r["Evaluación intentos terminados"] = intentos.length;
  r["Evaluación nota último intento"] = ultimo ? ultimo.nota : "";
  r["Evaluación mejor nota"] = intentos.length ? Math.max(...intentos.map(i => i.nota)) : "";
  if (ev.estado === "en curso") {
    r["Evaluación inicio"] = fechaTexto(ev.inicio);
    r["Evaluación fin"] = "";
    r["Evaluación duración (min)"] = "";
    r["Evaluación tiempo activo (min)"] = minutos(ev.activoMs || 0);
  } else {
    r["Evaluación inicio"] = ultimo ? fechaTexto(ultimo.inicio) : "";
    r["Evaluación fin"] = ultimo ? fechaTexto(ultimo.fin) : "";
    r["Evaluación duración (min)"] = ultimo ? ultimo.duracion : "";
    r["Evaluación tiempo activo (min)"] = ultimo ? ultimo.activo : "";
  }
  r["Avance total %"] = Math.floor(suma / (LECCIONES.length + 1));
  r["Estado actual"] = textoEstadoActual(estado);
  r["Última actividad"] = fechaTexto(estado.actualizado || Date.now());
  return r;
}

// Convierte x^2, x^(n-1) en exponentes elevados.
function formatoMatematico(texto) {
  if (!texto) return texto;
  const regex = /\^(\(([^()]*)\)|(-?[A-Za-z0-9]+))/g;
  const partes = [];
  let ultimo = 0;
  let match;
  let contador = 0;
  while ((match = regex.exec(texto)) !== null) {
    if (match.index > ultimo) partes.push(texto.slice(ultimo, match.index));
    const contenido = match[2] !== undefined ? match[2] : match[3];
    partes.push(<sup key={"exp-" + contador++}>{contenido}</sup>);
    ultimo = regex.lastIndex;
  }
  if (ultimo < texto.length) partes.push(texto.slice(ultimo));
  return partes;

    <div className="logos-encabezado">
      <div className="escudo-colegio">
        <img src={"data:image/png;base64," + COLEGIO_B64} alt="I.E. Técnica Agropecuaria de Luruaco" />
      </div>
      <div className="escudo">
        <img src={"data:image/png;base64," + LOGO_B64} alt="El Profe Royero" />
      </div>
    </div>

function AvisoGuardado({ sinc }) {
  if (sinc === "guardando") return <p className="aviso">Guardando tu avance...</p>;
  if (sinc === "ok") return <p className="aviso">Tu avance está guardado en el registro.</p>;
  if (sinc === "local") return <p className="aviso aviso-alerta">Sin conexión con el registro. Tu avance quedó guardado en este equipo y se enviará cuando haya internet.</p>;
  return null;
}

function MiniBarra({ valor }) {
  return (
    <div className="mini-barra"><div className="mini-relleno" style={{ width: valor + "%" }}></div></div>
  );
}

// ===================== PANTALLAS =====================
function PantallaInicio({ onEntrar }) {
  const [curso, setCurso] = useState("");
  const [nombreSel, setNombreSel] = useState("");
  const [modoManual, setModoManual] = useState(false);
  const [nombreManual, setNombreManual] = useState("");

  const listaEstudiantes = curso ? (ESTUDIANTES_POR_CURSO[curso] || []) : [];
  const nombreCompleto = modoManual ? nombreManual.trim() : nombreSel;
  const listo = Boolean(curso) && Boolean(nombreCompleto);

  return (
    <div className="tarjeta">
      <p className="texto">
        Vas a trabajar tres lecciones en orden: repaso de reglas básicas, regla del producto y regla del cociente.
        Cada una se debe terminar al 100% para abrir la siguiente, y al completar las tres se abre la evaluación final.
        Tu avance se guarda en cada paso: si sales, al volver continúas donde quedaste.
      </p>

      <label>Curso</label>
      <select value={curso} onChange={e => { setCurso(e.target.value); setNombreSel(""); setModoManual(false); setNombreManual(""); }}>
        <option value="">Selecciona tu curso</option>
        {CURSOS.map(c => <option key={c} value={c}>{c}</option>)}
      </select>

      <label>Nombre del estudiante</label>
      <select
        value={modoManual ? "__manual__" : nombreSel}
        onChange={e => {
          if (e.target.value === "__manual__") { setModoManual(true); setNombreSel(""); }
          else { setModoManual(false); setNombreSel(e.target.value); }
        }}
        disabled={!curso}
      >
        <option value="">{curso ? "Selecciona tu nombre" : "Primero elige tu curso"}</option>
        {listaEstudiantes.map(n => <option key={n} value={n}>{n}</option>)}
        {curso && <option value="__manual__">Mi nombre no aparece en la lista</option>}
      </select>

      {modoManual && (
        <input
          type="text"
          placeholder="Escribe tu nombre completo"
          value={nombreManual}
          onChange={e => setNombreManual(e.target.value)}
          style={{ marginTop: 8 }}
        />
      )}
      {modoManual && <p className="aviso">Escribe tu nombre siempre igual, así el simulador encuentra tu avance cuando vuelvas.</p>}

      <div style={{ textAlign: "center", marginTop: 16 }}>
        <button className="btn-primario" disabled={!listo} onClick={() => onEntrar(curso, nombreCompleto)}>
          Entrar
        </button>
      </div>
      {!listo && <p className="aviso">Elige tu curso y tu nombre para continuar.</p>}
    </div>
  );
}

function PantallaMapa({ alumno, estado, sinc, onAbrirLeccion, onRepasar, onAbrirEvaluacion, onNuevoIntento, onVerResultado, onSalir }) {
  const resumen = resumenDe(estado);
  const ev = estado.evaluacion;
  const evaluacionAbierta = leccionesCompletas(estado);
  const intentos = ev.intentos || [];

  return (
    <div className="tarjeta">
      <div className="barra-progreso">
        <span>{alumno.nombre} · {alumno.curso}</span>
        <span>Avance total: {resumen["Avance total %"]}%</span>
      </div>
      <div className="barra-fondo"><div className="barra-relleno" style={{ width: resumen["Avance total %"] + "%" }}></div></div>

      {LECCIONES.map((l, i) => {
        const p = estado.partes[l.id];
        const disponible = i === 0 || estado.partes[LECCIONES[i - 1].id].estado === "completada";
        const avance = avanceLeccion(l, p);
        let claseNum = "mapa-num";
        let detalle;
        if (p.estado === "completada") {
          claseNum += " hecha";
          detalle = "Completada · " + minutos(p.fin - p.inicio) + " min";
        } else if (!disponible) {
          detalle = "Se abre al terminar la lección " + i + " al 100%";
        } else {
          claseNum += " disponible";
          detalle = p.estado === "en curso" ? "En curso" : l.descripcion;
        }
        return (
          <div key={l.id} className={"mapa-item" + (disponible ? "" : " bloqueada")}>
            <div className={claseNum}>{l.numero}</div>
            <div className="mapa-info">
              <strong>{l.titulo}</strong>
              <span>{detalle}</span>
              <div className="mapa-avance"><MiniBarra valor={avance} /><b>{avance}%</b></div>
            </div>
            {disponible && p.estado === "completada" && <button className="btn-secundario" onClick={() => onRepasar(l.id)}>Repasar</button>}
            {disponible && p.estado === "en curso" && <button className="btn-primario" onClick={() => onAbrirLeccion(l.id)}>Continuar</button>}
            {disponible && p.estado === "pendiente" && <button className="btn-primario" onClick={() => onAbrirLeccion(l.id)}>Empezar</button>}
          </div>
        );
      })}

      <div className={"mapa-item" + (evaluacionAbierta ? "" : " bloqueada")}>
        <div className={"mapa-num" + (intentos.length ? " hecha" : (evaluacionAbierta ? " disponible" : ""))}>4</div>
        <div className="mapa-info">
          <strong>Evaluación final</strong>
          <span>
            {!evaluacionAbierta && "Se abre al terminar las tres lecciones al 100%"}
            {evaluacionAbierta && ev.estado === "pendiente" && "15 preguntas sobre los tres temas"}
            {evaluacionAbierta && ev.estado === "en curso" && ("Intento " + ev.intento + " en curso")}
            {evaluacionAbierta && ev.estado === "completada" && ("Intentos: " + intentos.length + " · última nota: " + intentos[intentos.length - 1].nota.toFixed(1))}
          </span>
          <div className="mapa-avance"><MiniBarra valor={avanceEvaluacion(ev)} /><b>{avanceEvaluacion(ev)}%</b></div>
        </div>
        {evaluacionAbierta && ev.estado === "pendiente" && <button className="btn-primario" onClick={onAbrirEvaluacion}>Presentar</button>}
        {evaluacionAbierta && ev.estado === "en curso" && <button className="btn-primario" onClick={onAbrirEvaluacion}>Continuar</button>}
        {evaluacionAbierta && ev.estado === "completada" && (
          <div className="botones-columna">
            <button className="btn-secundario" onClick={onVerResultado}>Ver resultado</button>
            <button className="btn-secundario" onClick={() => { if (window.confirm("Vas a empezar un intento nuevo de la evaluación. El intento anterior queda guardado en el registro. ¿Continuar?")) onNuevoIntento(); }}>Intento nuevo</button>
          </div>
        )}
      </div>

      <AvisoGuardado sinc={sinc} />
      <div style={{ textAlign: "center" }}>
        <button className="btn-secundario" onClick={onSalir}>Cambiar de estudiante</button>
      </div>
    </div>
  );
}

function TarjetaTeoria({ t }) {
  return (
    <div>
      <div className="etiqueta">Explicación</div>
      <h2 className="titulo-seccion">{t.titulo}</h2>
      <p className="texto">{formatoMatematico(t.texto)}</p>
      {t.formula && <div className="formula">{formatoMatematico(t.formula)}</div>}
      {t.ejemplo && t.ejemplo.length > 0 && (
        <div className="ejemplo">
          {t.ejemplo.map((linea, k) => <div key={k}>{formatoMatematico(linea)}</div>)}
        </div>
      )}
    </div>
  );
}

// Repaso libre de la explicación de una lección ya completada (no cambia el avance).
function PantallaRepaso({ leccion, onSalir }) {
  const [i, setI] = useState(0);
  return (
    <div className="tarjeta">
      <div className="barra-progreso">
        <span>Repaso · Lección {leccion.numero}: {leccion.titulo}</span>
        <span>{i + 1} de {leccion.teoria.length}</span>
      </div>
      <TarjetaTeoria t={leccion.teoria[i]} />
      <div className="fila-botones">
        <button className="btn-secundario" onClick={i > 0 ? () => setI(i - 1) : onSalir}>{i > 0 ? "Anterior" : "Volver al mapa"}</button>
        {i + 1 < leccion.teoria.length
          ? <button className="btn-primario" onClick={() => setI(i + 1)}>Siguiente</button>
          : <button className="btn-primario" onClick={onSalir}>Volver al mapa</button>}
      </div>
    </div>
  );
}

function PantallaLeccion({ leccion, parte, sinc, onCambiar, onTerminar, onSalir }) {
  const totalPasos = totalPasosDe(leccion);
  const ejercicio = leccion.ejercicios[parte.iEj];
  const paso = ejercicio ? ejercicio.pasos[parte.iPaso] : null;
  const orden = useMemo(() => paso ? ordenOpciones(paso.opciones.length) : [], [leccion.id, parte.iEj, parte.iPaso]);
  const avance = avanceLeccion(leccion, parte);

  if (parte.estado === "completada") {
    const precision = Math.round((parte.aciertos / totalPasos) * 100);
    const siguiente = LECCIONES.find(l => l.numero === leccion.numero + 1);
    return (
      <div className="tarjeta">
        <h2 className="titulo-seccion" style={{ textAlign: "center" }}>Lección {leccion.numero} terminada al 100%</h2>
        <p style={{ textAlign: "center", color: "#6B5B4A", margin: 0 }}>{leccion.titulo}</p>
        <div className="resumen-grid">
          <div className="resumen-item"><div className="valor">{parte.aciertos}/{totalPasos}</div><div className="rotulo">Pasos al primer intento</div></div>
          <div className="resumen-item"><div className="valor">{parte.errores}</div><div className="rotulo">Intentos fallidos</div></div>
          <div className="resumen-item"><div className="valor">{precision}%</div><div className="rotulo">Precisión</div></div>
        </div>
        <div className="tiempos">
          <div>Inicio: {fechaTexto(parte.inicio)}</div>
          <div>Fin: {fechaTexto(parte.fin)}</div>
          <div>Duración total: {minutos(parte.fin - parte.inicio)} min · Tiempo activo: {minutos(parte.activoMs)} min</div>
        </div>
        {precision < 60 && (
          <p className="texto">Varios pasos te costaron más de un intento. Antes de seguir, repasa esta lección desde el mapa.</p>
        )}
        <div style={{ textAlign: "center" }}>
          <button className="btn-primario" onClick={onSalir}>
            {siguiente ? "Volver al mapa y seguir con la lección " + siguiente.numero : "Volver al mapa y presentar la evaluación"}
          </button>
        </div>
        <AvisoGuardado sinc={sinc} />
      </div>
    );
  }

  const cabecera = (texto) => (
    <div>
      <div className="barra-progreso">
        <span>{texto}</span>
        <span>Avance de la lección: {avance}%</span>
      </div>
      <div className="barra-fondo"><div className="barra-relleno" style={{ width: avance + "%" }}></div></div>
    </div>
  );

  if (parte.fase === "teoria") {
    const ultima = parte.iTeoria === leccion.teoria.length - 1;
    return (
      <div className="tarjeta">
        {cabecera("Lección " + leccion.numero + " · explicación " + (parte.iTeoria + 1) + " de " + leccion.teoria.length)}
        <TarjetaTeoria t={leccion.teoria[parte.iTeoria]} />
        <div className="fila-botones">
          <div>
            {parte.iTeoria > 0
              ? <button className="btn-secundario" onClick={() => onCambiar(p => ({ ...p, iTeoria: p.iTeoria - 1 }))}>Anterior</button>
              : <button className="btn-secundario" onClick={onSalir}>Volver al mapa</button>}
          </div>
          <button className="btn-primario" onClick={() => {
            if (ultima) onCambiar(p => ({ ...p, fase: "ejercicios", teoriaVista: leccion.teoria.length }));
            else onCambiar(p => ({ ...p, iTeoria: p.iTeoria + 1, teoriaVista: Math.max(p.teoriaVista, p.iTeoria + 1) }));
            window.scrollTo(0, 0);
          }}>
            {ultima ? "Ir a los ejercicios guiados" : "Siguiente"}
          </button>
        </div>
        <AvisoGuardado sinc={sinc} />
      </div>
    );
  }

  const elegir = (idx) => {
    if (parte.resuelto || parte.descartadas.includes(idx)) return;
    if (idx === paso.correcta) {
      onCambiar(p => ({ ...p, resuelto: true, pasosHechos: p.pasosHechos + 1, aciertos: p.descartadas.length === 0 ? p.aciertos + 1 : p.aciertos }));
    } else {
      onCambiar(p => ({ ...p, descartadas: [...p.descartadas, idx], errores: p.errores + 1 }));
    }
  };

  const ultimoPaso = parte.iPaso + 1 >= ejercicio.pasos.length;
  const ultimoEjercicio = parte.iEj + 1 >= leccion.ejercicios.length;

  const continuar = () => {
    if (!ultimoPaso) onCambiar(p => ({ ...p, iPaso: p.iPaso + 1, descartadas: [], resuelto: false }));
    else if (!ultimoEjercicio) onCambiar(p => ({ ...p, iEj: p.iEj + 1, iPaso: 0, descartadas: [], resuelto: false }));
    else onTerminar();
    window.scrollTo(0, 0);
  };

  const numeroPaso = parte.resuelto ? parte.pasosHechos : parte.pasosHechos + 1;

  return (
    <div className="tarjeta">
      {cabecera("Lección " + leccion.numero + " · ejercicio " + (parte.iEj + 1) + " de " + leccion.ejercicios.length + " · paso " + numeroPaso + " de " + totalPasos)}

      <div className="etiqueta">Ejercicio guiado</div>
      <div className="enunciado">{formatoMatematico(ejercicio.enunciado)}</div>
      {ejercicio.contexto && <div className="contexto">{formatoMatematico(ejercicio.contexto)}</div>}

      {parte.iPaso > 0 && (
        <div className="pasos-hechos">
          {ejercicio.pasos.slice(0, parte.iPaso).map((p, k) => (
            <div key={k} className="paso-hecho"><span>Paso {k + 1}.</span>{formatoMatematico(p.opciones[p.correcta])}</div>
          ))}
        </div>
      )}

      <div className="pregunta">Paso {parte.iPaso + 1}. {formatoMatematico(paso.pregunta)}</div>

      {orden.map(idx => {
        let clase = "opcion";
        if (parte.resuelto && idx === paso.correcta) clase += " correcta";
        else if (parte.descartadas.includes(idx)) clase += " incorrecta";
        return (
          <button key={idx} className={clase} disabled={parte.resuelto || parte.descartadas.includes(idx)} onClick={() => elegir(idx)}>
            {formatoMatematico(paso.opciones[idx])}
          </button>
        );
      })}

      {!parte.resuelto && parte.descartadas.length > 0 && (
        <div className="pista">Esa no es. Pista: {formatoMatematico(paso.pista)} Vuelve a intentarlo.</div>
      )}
      {parte.resuelto && <div className="explicacion">{formatoMatematico(paso.explicacion)}</div>}

      <div className="fila-botones">
        <button className="btn-secundario" onClick={onSalir}>Salir y continuar después</button>
        {parte.resuelto && (
          <button className="btn-primario" onClick={continuar}>
            {!ultimoPaso ? "Siguiente paso" : (!ultimoEjercicio ? "Siguiente ejercicio" : "Terminar la lección")}
          </button>
        )}
      </div>
      <AvisoGuardado sinc={sinc} />
    </div>
  );
}

function PantallaEvaluacion({ ev, sinc, onResponder, onSalir }) {
  const [elegida, setElegida] = useState(null);
  useEffect(() => { setElegida(null); }, [ev.indice, ev.intento]);

  const total = EVALUACION.length;
  const id = ev.orden[ev.indice];
  const q = EVALUACION.find(p => p.id === id);
  if (!q) return null;
  const orden = String(ev.opciones[id] || "0123").split("").map(Number);
  const avance = avanceEvaluacion(ev);

  return (
    <div className="tarjeta">
      <div className="barra-progreso">
        <span>Evaluación final · intento {ev.intento} · pregunta {ev.indice + 1} de {total}</span>
        <span>Avance: {avance}%</span>
      </div>
      <div className="barra-fondo"><div className="barra-relleno" style={{ width: avance + "%" }}></div></div>

      <div className="etiqueta">{q.tema}</div>
      <div className="pregunta">{formatoMatematico(q.enunciado)}</div>

      {orden.map(idx => (
        <button key={idx} className={"opcion" + (elegida === idx ? " elegida" : "")} onClick={() => setElegida(idx)}>
          {formatoMatematico(q.opciones[idx])}
        </button>
      ))}

      <div className="fila-botones">
        <button className="btn-secundario" onClick={onSalir}>Salir y continuar después</button>
        <button className="btn-primario" disabled={elegida === null} onClick={() => { onResponder(id, elegida); window.scrollTo(0, 0); }}>
          {ev.indice + 1 < total ? "Confirmar y seguir" : "Confirmar y terminar"}
        </button>
      </div>
      <p className="aviso">En la evaluación no hay pistas. Cada respuesta confirmada queda guardada y no se puede cambiar.</p>
      <AvisoGuardado sinc={sinc} />
    </div>
  );
}

function PantallaResultadoEval({ alumno, ev, sinc, onVolver }) {
  const intentos = ev.intentos || [];
  const registro = intentos[intentos.length - 1];
  if (!registro) return null;
  const preguntas = ev.orden.map(id => EVALUACION.find(q => q.id === id));

  return (
    <div className="tarjeta">
      <h2 className="titulo-seccion" style={{ textAlign: "center" }}>Resultado de la evaluación</h2>
      <p style={{ textAlign: "center", color: "#6B5B4A", margin: "0 0 6px" }}>{alumno.nombre} · Curso {alumno.curso} · Intento {registro.intento}</p>

      <div className="resultado-num">
        <div className="nota">{registro.nota.toFixed(1)}</div>
        <div className="sobre">sobre 5.0</div>
      </div>

      <div className="resumen-grid">
        <div className="resumen-item"><div className="valor">{registro.correctas}</div><div className="rotulo">Correctas</div></div>
        <div className="resumen-item"><div className="valor">{registro.incorrectas}</div><div className="rotulo">Incorrectas</div></div>
        <div className="resumen-item"><div className="valor">{registro.porcentaje}%</div><div className="rotulo">Porcentaje</div></div>
      </div>
      <div className="tiempos">
        <div>Inicio: {fechaTexto(registro.inicio)}</div>
        <div>Fin: {fechaTexto(registro.fin)}</div>
        <div>Duración total: {registro.duracion} min · Tiempo activo: {registro.activo} min</div>
      </div>
      <AvisoGuardado sinc={sinc} />

      <h3 className="titulo-seccion" style={{ fontSize: 16, marginTop: 18 }}>Revisión pregunta por pregunta</h3>
      {preguntas.map((q, k) => {
        const bien = ev.elecciones[q.id] === q.correcta;
        return (
          <div key={q.id} className="revision">
            <p><span className={bien ? "marca-ok" : "marca-bad"}>{bien ? "Correcta" : "Incorrecta"}</span> · Pregunta {k + 1} · {q.tema}</p>
            <p>{formatoMatematico(q.enunciado)}</p>
            {!bien && <p>Tu respuesta: {formatoMatematico(q.opciones[ev.elecciones[q.id]])}</p>}
            <p>Respuesta correcta: {formatoMatematico(q.opciones[q.correcta])}</p>
            <p style={{ color: "#555" }}>{formatoMatematico(q.explicacion)}</p>
          </div>
        );
      })}

      <div style={{ textAlign: "center", marginTop: 14 }}>
        <button className="btn-primario" onClick={onVolver}>Volver al mapa</button>
      </div>
    </div>
  );
}

// ===================== APLICACIÓN =====================
function App() {
  const [pantalla, setPantalla] = useState("inicio");
  const [alumno, setAlumno] = useState(null);
  const [estado, setEstado] = useState(null);
  const [vista, setVista] = useState(null);
  const [sinc, setSinc] = useState("");

  const alumnoRef = useRef(null);
  const estadoRef = useRef(null);
  const enviandoRef = useRef(false);
  const otraVezRef = useRef(false);

  const fijarEstado = (nuevo) => {
    estadoRef.current = nuevo;
    setEstado(nuevo);
    if (alumnoRef.current) guardarLocal(alumnoRef.current, nuevo);
  };

  // Envía al registro los eventos pendientes (lección o evaluación terminada) y luego el avance completo.
  // Solo hay un envío a la vez; si hay cambios mientras se envía, se repite al terminar.
  const sincronizar = () => {
    if (!alumnoRef.current || !estadoRef.current) return;
    if (enviandoRef.current) { otraVezRef.current = true; return; }
    enviandoRef.current = true;
    setSinc("guardando");
    const { curso, nombre } = alumnoRef.current;
    const base = { asignatura: ASIGNATURA, curso, nombre, fingerprint: generarFingerprint() };

    (async () => {
      let fallo = false;
      const lista = (estadoRef.current.pendientes || []).slice();
      for (const pend of lista) {
        try {
          const r = await llamarScript({ ...base, accion: "registro", id: pend.id, ...pend.datos });
          if (r && r.ok) {
            const actual = estadoRef.current;
            fijarEstado({ ...actual, pendientes: actual.pendientes.filter(x => x.id !== pend.id) });
          } else {
            fallo = true;
          }
        } catch (e) {
          fallo = true;
        }
      }
      try {
        const actual = estadoRef.current;
        const r = await llamarScript({ ...base, accion: "guardar", estado: JSON.stringify(actual), resumen: JSON.stringify(resumenDe(actual)) });
        if (!r || !r.ok) fallo = true;
      } catch (e) {
        fallo = true;
      }
      enviandoRef.current = false;
      setSinc(fallo ? "local" : "ok");
      if (otraVezRef.current) {
        otraVezRef.current = false;
        sincronizar();
      }
    })();
  };

  const actualizar = (transformar) => {
    const nuevo = transformar(estadoRef.current);
    if (nuevo === estadoRef.current) return;
    fijarEstado({ ...nuevo, actualizado: Date.now() });
    sincronizar();
  };

  // Si quedó algo sin enviar por falta de internet, se reintenta cada minuto.
  useEffect(() => {
    if (sinc !== "local") return;
    const reloj = setInterval(() => { if (!enviandoRef.current) sincronizar(); }, 60000);
    return () => clearInterval(reloj);
  }, [sinc]);

  const entrar = async (curso, nombre) => {
    const a = { curso, nombre };
    alumnoRef.current = a;
    setAlumno(a);
    setPantalla("cargando");
    const local = leerLocal(a);
    let elegido = local;
    try {
      const r = await llamarScript({ asignatura: ASIGNATURA, accion: "leer", curso, nombre }, 15000);
      if (r && r.ok && r.estado) {
        const servidor = normalizarEstado(r.estado);
        if (!local || servidor.actualizado > local.actualizado) elegido = servidor;
      }
      setSinc("ok");
    } catch (e) {
      setSinc("local");
    }
    fijarEstado(elegido || estadoNuevo());
    setPantalla("mapa");
    if ((estadoRef.current.pendientes || []).length) sincronizar();
  };

  const salir = () => {
    alumnoRef.current = null;
    estadoRef.current = null;
    setAlumno(null);
    setEstado(null);
    setSinc("");
    setPantalla("inicio");
  };

  const irAlMapa = () => { setPantalla("mapa"); setVista(null); window.scrollTo(0, 0); };

  const abrirLeccion = (id) => {
    const ahora = Date.now();
    actualizar(e => {
      const p = e.partes[id];
      const nueva = p.estado === "pendiente"
        ? { ...p, estado: "en curso", inicio: ahora, ultimoToque: ahora }
        : { ...p, ultimoToque: ahora };
      return { ...e, partes: { ...e.partes, [id]: nueva } };
    });
    setVista(id);
    setPantalla("leccion");
    window.scrollTo(0, 0);
  };

  const cambiarParte = (id) => (fn) => {
    const ahora = Date.now();
    actualizar(e => {
      if (e.partes[id].estado !== "en curso") return e;
      return { ...e, partes: { ...e.partes, [id]: tocar(fn(e.partes[id]), ahora) } };
    });
  };

  const terminarLeccion = (id) => {
    const ahora = Date.now();
    const leccion = LECCIONES.find(l => l.id === id);
    actualizar(e => {
      const previa = e.partes[id];
      if (previa.estado !== "en curso") return e;
      const p = { ...tocar(previa, ahora), estado: "completada", fin: ahora, descartadas: [], resuelto: false };
      const pasos = totalPasosDe(leccion);
      const pendiente = {
        id: idUnico(),
        datos: {
          tipo: "leccion",
          leccion: leccion.numero + ". " + leccion.titulo,
          avance: 100,
          pasos: pasos,
          aciertos: p.aciertos,
          errores: p.errores,
          precision: Math.round((p.aciertos / pasos) * 100),
          inicio: fechaTexto(p.inicio),
          fin: fechaTexto(p.fin),
          duracion: minutos(p.fin - p.inicio),
          activo: minutos(p.activoMs)
        }
      };
      return { ...e, partes: { ...e.partes, [id]: p }, pendientes: [...e.pendientes, pendiente] };
    });
  };

  const abrirEvaluacion = () => {
    const ahora = Date.now();
    actualizar(e => {
      const ev = e.evaluacion;
      if (ev.estado === "en curso") return { ...e, evaluacion: { ...ev, ultimoToque: ahora } };
      if (ev.estado === "completada") return e;
      return { ...e, evaluacion: iniciarIntento(ev, ahora) };
    });
    setPantalla("evaluacion");
    window.scrollTo(0, 0);
  };

  const nuevoIntento = () => {
    const ahora = Date.now();
    actualizar(e => ({ ...e, evaluacion: iniciarIntento(e.evaluacion, ahora) }));
    setPantalla("evaluacion");
    window.scrollTo(0, 0);
  };

  const responder = (id, idx) => {
    const ahora = Date.now();
    let termino = false;
    actualizar(e => {
      const previa = e.evaluacion;
      if (previa.estado !== "en curso" || previa.orden[previa.indice] !== id) return e;
      let ev = tocar(previa, ahora);
      ev = { ...ev, elecciones: { ...ev.elecciones, [id]: idx }, indice: ev.indice + 1 };
      if (ev.indice < EVALUACION.length) return { ...e, evaluacion: ev };

      termino = true;
      const res = calcularResultado(ev);
      const registro = {
        intento: ev.intento, ...res,
        inicio: ev.inicio, fin: ahora,
        duracion: minutos(ahora - ev.inicio),
        activo: minutos(ev.activoMs)
      };
      const datos = {
        tipo: "evaluacion",
        intento: ev.intento,
        avance: 100,
        correctas: res.correctas,
        incorrectas: res.incorrectas,
        porcentaje: res.porcentaje,
        nota: res.nota,
        inicio: fechaTexto(ev.inicio),
        fin: fechaTexto(ahora),
        duracion: registro.duracion,
        activo: registro.activo
      };
      EVALUACION.forEach(q => { datos["p" + q.id] = ev.elecciones[q.id] === q.correcta ? "✓" : "✗"; });
      ev = { ...ev, estado: "completada", fin: ahora, intentos: [...(ev.intentos || []), registro] };
      return { ...e, evaluacion: ev, pendientes: [...e.pendientes, { id: idUnico(), datos }] };
    });
    if (termino) setPantalla("resultado");
  };

  const leccion = LECCIONES.find(l => l.id === vista);

  return (
    <div className="contenedor">
      <div className="encabezado">
        <Escudo />
        <h1>Derivadas: producto y cociente</h1>
        <p>Lecciones guiadas y evaluación final · El Profe Royero</p>
      </div>

      {pantalla === "inicio" && <PantallaInicio onEntrar={entrar} />}

      {pantalla === "cargando" && (
        <div className="tarjeta"><p className="texto" style={{ textAlign: "center", margin: 0 }}>Buscando tu avance guardado...</p></div>
      )}

      {pantalla === "mapa" && estado && (
        <PantallaMapa
          alumno={alumno} estado={estado} sinc={sinc}
          onAbrirLeccion={abrirLeccion}
          onRepasar={(id) => { setVista(id); setPantalla("repaso"); window.scrollTo(0, 0); }}
          onAbrirEvaluacion={abrirEvaluacion}
          onNuevoIntento={nuevoIntento}
          onVerResultado={() => { setPantalla("resultado"); window.scrollTo(0, 0); }}
          onSalir={salir}
        />
      )}

      {pantalla === "repaso" && leccion && <PantallaRepaso leccion={leccion} onSalir={irAlMapa} />}

      {pantalla === "leccion" && leccion && estado && (
        <PantallaLeccion
          leccion={leccion} parte={estado.partes[leccion.id]} sinc={sinc}
          onCambiar={cambiarParte(leccion.id)}
          onTerminar={() => terminarLeccion(leccion.id)}
          onSalir={irAlMapa}
        />
      )}

      {pantalla === "evaluacion" && estado && estado.evaluacion.estado === "en curso" && (
        <PantallaEvaluacion ev={estado.evaluacion} sinc={sinc} onResponder={responder} onSalir={irAlMapa} />
      )}

      {pantalla === "resultado" && estado && (
        <PantallaResultadoEval alumno={alumno} ev={estado.evaluacion} sinc={sinc} onVolver={irAlMapa} />
      )}

      <div className="pie">
        <strong>I.E. Técnica Agropecuaria de Luruaco</strong><br />
        Docente: Jorge Eduardo Royero
      </div>
    </div>
  );
}

function iniciarIntento(ev, ahora) {
  const opciones = {};
  EVALUACION.forEach(q => { opciones[q.id] = ordenOpciones(q.opciones.length).join(""); });
  return {
    ...ev,
    estado: "en curso",
    intento: (ev.intentos || []).length + 1,
    inicio: ahora, fin: null, activoMs: 0, ultimoToque: ahora,
    orden: barajar(EVALUACION.map(q => q.id)),
    opciones, elecciones: {}, indice: 0
  };
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
